# Railway Nixpacks build for Next.js standalone
[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "export NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.everydaysurprises.com/v1}",
  "npm run build"
]

[start]
cmd = "node server.js"
